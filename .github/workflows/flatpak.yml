name: Flatpak (BazzitePods)

on:
  push:
    branches:
      - bazzite
      - main
    tags:
      - 'v*'
    paths:
      - 'linux-rust/**'
      - '!linux-rust/**/*.md'
      - '.github/workflows/flatpak.yml'
  pull_request:
    paths:
      - 'linux-rust/**'
      - '!linux-rust/**/*.md'
      - '.github/workflows/flatpak.yml'
  workflow_dispatch:

concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flatpak:
    name: Build Flatpak bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the bundle to a GitHub Release on tags
    container:
      # Must match runtime-version in the manifest.
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    steps:
      - uses: actions/checkout@v6

      - name: Validate desktop file and metainfo
        run: |
          if command -v desktop-file-validate >/dev/null; then
            desktop-file-validate linux-rust/assets/io.github.dabarkle.BazzitePods.desktop
          fi
          if command -v appstreamcli >/dev/null; then
            appstreamcli validate --no-net linux-rust/flatpak/io.github.dabarkle.BazzitePods.metainfo.xml
          fi

      # Link-time optimisation makes the binaries about 20% smaller but adds over a minute
      # to every build. Pull requests only need to prove the Flatpak builds and give a
      # bundle to try, so they skip it; main and release tags keep the full release build.
      - name: Skip link-time optimisation on pull requests
        if: github.event_name == 'pull_request'
        run: |
          manifest=linux-rust/flatpak/io.github.dabarkle.BazzitePods.yml
          sed -i "s/^    CARGO_NET_OFFLINE: 'true'$/&\n    CARGO_PROFILE_RELEASE_LTO: 'false'/" "$manifest"
          grep -q "CARGO_PROFILE_RELEASE_LTO: 'false'" "$manifest"

      - name: Build
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: linux-rust/flatpak/io.github.dabarkle.BazzitePods.yml
          bundle: BazzitePods.flatpak
          # cargo-sources.json lists only third-party crates, so unlike Cargo.lock it does
          # not change with every version bump of the app itself.
          cache-key: flatpak-builder-${{ hashFiles('linux-rust/flatpak/cargo-sources.json') }}
          upload-artifact: false

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: BazzitePods.flatpak
          path: BazzitePods.flatpak
          if-no-files-found: error

      - name: Attach bundle to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: BazzitePods.flatpak
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
