# Merges Dependabot security updates for the BazzitePods app by itself, but only
# when they are safe to take without a human look:
#   * the PR was opened by Dependabot,
#   * it only touches the Rust (Cargo) dependency files under linux-rust/,
#   * every crate version it changes is a semver-compatible bump (no major bumps,
#     which for 0.x crates means no 0.x -> 0.y), and it adds no new crates, and
#   * the Flatpak build for that exact commit passed.
# Everything else (major bumps, new crates, non-Cargo updates, failed builds) is
# left open for the daily Dependabot check and for David.
#
# The bump size is read from Cargo.lock itself rather than from Dependabot's
# metadata, because grouped security updates (the only kind enabled here) report
# no update type.
#
# Note: a Cargo.lock bump also needs flatpak/cargo-sources.json regenerated, or the
# offline Flatpak build fails. When the daily check pushes that fix, this workflow
# runs again on the new commit and merges once the rebuilt Flatpak passes.
name: Dependabot auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Decide whether this update can merge by itself
        id: eligible
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: python
        run: |
          import json, os, subprocess, sys, tomllib

          def gh(*args):
              return subprocess.run(["gh", "api", *args], check=True,
                                    capture_output=True, text=True).stdout

          def decide(ok, why):
              print(why)
              with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                  out.write(f"ok={'true' if ok else 'false'}\n")
              sys.exit(0)

          repo, pr = os.environ["REPO"], os.environ["PR"]
          files = json.loads(gh("--paginate", "--slurp", f"repos/{repo}/pulls/{pr}/files"))
          names = {f["filename"] for page in files for f in page}
          allowed = {"linux-rust/Cargo.lock", "linux-rust/Cargo.toml",
                     "linux-rust/flatpak/cargo-sources.json"}
          print("Changed files:", ", ".join(sorted(names)))
          if "linux-rust/Cargo.lock" not in names or not names <= allowed:
              decide(False, "Not a linux-rust Cargo update; leaving it for review.")

          def lock(sha):
              raw = gh("-H", "Accept: application/vnd.github.raw",
                       f"repos/{repo}/contents/linux-rust/Cargo.lock?ref={sha}")
              versions = {}
              for p in tomllib.loads(raw).get("package", []):
                  versions.setdefault(p["name"], set()).add(p["version"])
              return versions

          def compat(version):
              # Cargo's semver rule: 1.2.3 ~ 1.x, 0.2.3 ~ 0.2.x, 0.0.3 only itself.
              major, minor, patch = (version.split("+")[0].split("-")[0].split(".") + ["0", "0"])[:3]
              if major != "0":
                  return (major,)
              if minor != "0":
                  return ("0", minor)
              return ("0", "0", patch)

          base, head = lock(os.environ["BASE_SHA"]), lock(os.environ["HEAD_SHA"])
          for name, new in sorted(head.items()):
              old = base.get(name, set())
              for version in sorted(new - old):
                  if not old:
                      decide(False, f"Adds a new crate {name} {version}; leaving it for review.")
                  if compat(version) not in {compat(v) for v in old}:
                      decide(False, f"{name} {sorted(old)} -> {version} is a major bump; leaving it for review.")
                  print(f"{name}: {sorted(old)} -> {version} (compatible)")
          decide(True, "Only semver-compatible bumps; waiting for the Flatpak build.")

      - name: Wait for the Flatpak build of this commit
        id: build
        if: steps.eligible.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Poll the "Build Flatpak bundle" check on the PR's head commit until it
          # finishes (it can take a while on a cold cache).
          for _ in $(seq 1 110); do
            run="$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=Build%20Flatpak%20bundle" \
              --jq '.check_runs | sort_by(.started_at) | last | "\(.status) \(.conclusion)"')"
            echo "Flatpak build: ${run:-not started yet}"
            case "$run" in
              "completed success")
                echo "passed=true" >> "$GITHUB_OUTPUT"
                exit 0 ;;
              completed*)
                echo "Flatpak build did not pass; leaving the PR open."
                echo "passed=false" >> "$GITHUB_OUTPUT"
                exit 0 ;;
            esac
            sleep 60
          done
          echo "Timed out waiting for the Flatpak build; leaving the PR open."
          echo "passed=false" >> "$GITHUB_OUTPUT"

      - name: Merge
        if: steps.build.outputs.passed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # --match-head-commit: only merge the exact commit that was built.
          gh pr merge "$PR_URL" --squash --delete-branch --match-head-commit "$SHA"
