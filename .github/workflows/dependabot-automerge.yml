# Merges Dependabot security updates for the BazzitePods app by itself, but only
# when they are safe to take without a human look:
#   * the PR was opened by Dependabot,
#   * it updates a Rust crate (Cargo) under linux-rust/,
#   * it is a patch or minor version bump (major bumps can break things),
#   * the Flatpak build for that exact commit passed, and
#   * the test suite for that exact commit passed (tests.yml, "Run tests").
# Everything else (major bumps, non-Cargo updates, failed builds or tests) is left open
# for the daily Dependabot check and for David.
#
# Note: a Cargo.lock bump also needs flatpak/cargo-sources.json regenerated, or the
# offline Flatpak build fails. When the daily check pushes that fix, this workflow
# runs again on the new commit and merges once the rebuilt Flatpak passes.
name: Dependabot auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Read Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether this update can merge by itself
        id: eligible
        env:
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
          DIRECTORY: ${{ steps.meta.outputs.directory }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
        run: |
          echo "ecosystem=$ECOSYSTEM directory=$DIRECTORY update-type=$UPDATE_TYPE"
          if [ "$ECOSYSTEM" = "cargo" ] \
             && [ "${DIRECTORY%/}" = "/linux-rust" ] \
             && { [ "$UPDATE_TYPE" = "version-update:semver-patch" ] \
                  || [ "$UPDATE_TYPE" = "version-update:semver-minor" ]; }; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not a patch/minor Cargo update for linux-rust; leaving it for review."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for the Flatpak build and the tests of this commit
        id: build
        if: steps.eligible.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Poll both required checks on the PR's head commit until each finishes (the
          # Flatpak build can take a while on a cold cache). Every one must succeed.
          state() {
            gh api "repos/$REPO/commits/$SHA/check-runs?check_name=$1" \
              --jq '.check_runs | sort_by(.started_at) | last | "\(.status) \(.conclusion)"'
          }
          for _ in $(seq 1 110); do
            flatpak="$(state 'Build%20Flatpak%20bundle')"
            tests="$(state 'Run%20tests')"
            echo "Flatpak build: ${flatpak:-not started yet}; tests: ${tests:-not started yet}"
            for run in "$flatpak" "$tests"; do
              case "$run" in
                "completed success") ;;
                completed*)
                  echo "A required check did not pass; leaving the PR open."
                  echo "passed=false" >> "$GITHUB_OUTPUT"
                  exit 0 ;;
              esac
            done
            if [ "$flatpak" = "completed success" ] && [ "$tests" = "completed success" ]; then
              echo "passed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 60
          done
          echo "Timed out waiting for the Flatpak build and tests; leaving the PR open."
          echo "passed=false" >> "$GITHUB_OUTPUT"

      - name: Merge
        if: steps.build.outputs.passed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # --match-head-commit: only merge the exact commit that was built and tested.
          gh pr merge "$PR_URL" --squash --delete-branch --match-head-commit "$SHA"
