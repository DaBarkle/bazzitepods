# Runs the Kase test suite (linux-rust/) on every pull request and on pushes to
# main/bazzite, and reports how much of the code the tests exercise.
#
# The tests need no Bluetooth, AirPods, sound server or display: packets, adverts and the
# audio server are faked, so they run the same here as on a desktop.
#
# The coverage floor below fails the run if coverage drops noticeably (for example, a big
# new feature landing without tests). Raise it as coverage grows; never lower it to get a
# PR through. Code that only works against real hardware (the window, the Bluetooth and
# D-Bus plumbing) is not expected to be covered, so the floor is well below 100%.
name: Tests

on:
  push:
    branches:
      - main
      - bazzite
    paths:
      - 'linux-rust/**'
      - '!linux-rust/**/*.md'
      - '.github/workflows/tests.yml'
  # Every pull request runs this, docs-only ones included: it is a required check on main,
  # and a check that never starts would leave the PR unmergeable.
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Lines covered by tests, in percent. 45.2% when this was set up (2026-10-25), 47.6% on
  # 2026-10-28 after the restructure.
  COVERAGE_FLOOR: 47

jobs:
  test:
    # The Dependabot auto-merge workflow waits for a check with exactly this name.
    name: Run tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: linux-rust
    steps:
      - uses: actions/checkout@v6

      # Cached between runs: a plain apt-get install took 2 to 5 minutes (a slow Ubuntu
      # mirror), several times longer than building and running the tests.
      - name: Install system libraries
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: pkg-config libdbus-1-dev libpulse-dev libxkbcommon-dev libwayland-dev libavcodec-dev
          version: 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview, clippy, rustfmt

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      # Keyed on the compiler version as well as Cargo.lock, and trimmed of our own crate's
      # build output before saving, so the cache stays small and useful.
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: linux-rust
          shared-key: tests

      - name: Check formatting
        run: cargo fmt --check

      # shellcheck is preinstalled on GitHub's Ubuntu runners.
      - name: Check installer scripts
        run: shellcheck packaging/*.sh

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests with coverage
        run: |
          cargo llvm-cov --all-targets --locked \
            --ignore-filename-regex 'third_party/' \
            --fail-under-lines "$COVERAGE_FLOOR" \
            --summary-only | tee coverage.txt

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage.txt ]; then
            {
              echo "### Test coverage (floor: ${COVERAGE_FLOOR}% of lines)"
              echo '```'
              grep -E '^(Filename|-{10,}|TOTAL|[^ ]+\.rs )' coverage.txt || cat coverage.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
