<?xml version="1.0" encoding="UTF-8"?>
<!-- BazzitePods app icon: an AirPods case (lid, seam, status light). Original artwork, AGPL-3.0-only (same licence as the app). -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="6" x2="0" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dde4f2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0.6" stdDeviation="0.8" flood-color="#1e1b4b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded-square tile with a soft top sheen -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bg)"/>
  <path d="M136 32h240a104 104 0 0 1 104 104v40C400 210 320 224 256 224S112 210 32 176v-40A104 104 0 0 1 136 32z" fill="#ffffff" opacity="0.07"/>

  <!-- The case: 32-unit geometry shared with the tray icon and the overlay glyph -->
  <g filter="url(#shadow)" transform="translate(96 96) scale(10)" fill="url(#shell)">
    <path d="M4 12.3V12.3A6.3 6.3 0 0 1 10.3 6H21.7A6.3 6.3 0 0 1 28 12.3Z"/>
    <path fill-rule="evenodd" d="M4 14.1H28V19A7 7 0 0 1 21 26H11A7 7 0 0 1 4 19Z M17.7 19.6A1.7 1.7 0 1 0 14.3 19.6A1.7 1.7 0 1 0 17.7 19.6Z"/>
  </g>
</svg>
