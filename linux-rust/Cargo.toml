[package]
name = "kase"
version = "0.9.2"
edition = "2024"

[dependencies]
tokio = {version = "1.50.0", features = ["full"]}
bluer = { version = "0.17.4", features = ["full"] }
env_logger = {version = "0.11.10", features = ["auto-color"]}
uuid = "1.23.0"
log = "0.4.29"
dbus = "0.9.10"
hex = "0.4.3"
iced = { version = "0.14.0", features = ["tokio", "image", "canvas"] }
libpulse-binding = "2.30.1"
ksni = "0.3.1"
image = "0.25.8"
clap = { version = "4.6.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aes = "0.9.0-rc.4"
futures = "0.3.32"
tokio-util = "0.7"
dbus-tokio = "0.7.6"
iced_layershell = { version = "0.19.1", default-features = false }
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
libc = "0.2.184"

[lib]
name = "kase"
path = "src/lib.rs"

[[bin]]
name = "kase"
path = "src/main.rs"

[[bin]]
name = "kase-overlay"
path = "src/bin/kase-overlay/main.rs"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 8
panic = "abort"
strip = true

# iced_wgpu with one change: prefer 8-bit-alpha surface formats (see the patch comment in
# third_party/iced_wgpu/src/window/compositor.rs). Drop this once upstream does the same.
[patch.crates-io]
iced_wgpu = { path = "third_party/iced_wgpu" }
